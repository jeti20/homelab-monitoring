---
# ─── Debian / Ubuntu ─────────────────────────────────────────────────────────

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  when: ansible_os_family == "Debian"

- name: Download Grafana GPG key
  ansible.builtin.get_url:
    url: https://apt.grafana.com/gpg.key
    dest: /etc/apt/keyrings/grafana.asc
    mode: '0644'
  when: ansible_os_family == "Debian"

- name: Add Grafana repository (Debian)
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/grafana.asc] https://apt.grafana.com stable main"
    state: present
    filename: grafana
  when: ansible_os_family == "Debian"

- name: Install Grafana (Debian)
  ansible.builtin.apt:
    name: grafana
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

# ─── RedHat / CentOS ─────────────────────────────────────────────────────────

- name: Add Grafana repository (RedHat)
  ansible.builtin.yum_repository:
    name: grafana
    description: Grafana
    baseurl: https://rpm.grafana.com
    repo_gpgcheck: true
    gpgcheck: true
    gpgkey: https://rpm.grafana.com/gpg.key
    enabled: true
  when: ansible_os_family == "RedHat"

- name: Install Grafana (RedHat)
  ansible.builtin.dnf:
    name: grafana
    state: present
  when: ansible_os_family == "RedHat"

# ─── Common configuration ────────────────────────────────────────────────────

- name: Create grafana-server systemd override directory
  ansible.builtin.file:
    path: /etc/systemd/system/grafana-server.service.d
    state: directory
    mode: '0755'

- name: Configure Grafana environment (systemd override)
  ansible.builtin.copy:
    dest: /etc/systemd/system/grafana-server.service.d/override.conf
    content: |
      [Service]
      Environment="GF_SECURITY_ADMIN_PASSWORD={{ grafana_admin_password }}"
      Environment="GF_USERS_ALLOW_SIGN_UP=false"
    mode: '0644'
  notify: Restart grafana

- name: Enable and start grafana-server
  ansible.builtin.systemd:
    name: grafana-server
    enabled: true
    state: started
    daemon_reload: true
